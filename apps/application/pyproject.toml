[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-browser-harness"
version = "0.1.0"
description = "Loopback Playwright CLI service for human-reviewed job applications"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "pypdf==6.10.2",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "google-auth[requests]==2.57.0",
  "google-auth-oauthlib==1.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
jobhunter-browser-harness = "jobhunter_browser_harness.cli:main"

[tool.setuptools]
packages = ["jobhunter_browser_harness"]
package-dir = { jobhunter_browser_harness = "src/browser_harness" }

[tool.setuptools.package-data]
jobhunter_browser_harness = ["playwright-cli-agent.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
